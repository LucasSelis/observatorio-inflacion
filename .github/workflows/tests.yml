name: tests

on:
  push:
  pull_request:

# Permisos minimos: el workflow solo necesita leer el codigo.
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Los tests usan el snapshot versionado (datos/snapshot): no dependen de que la API esté arriba.
      - run: pytest -q
      - name: Pipeline completo sobre el snapshot (dbt build con sus tests + backtest)
        run: python -m observatorio.cli actualizar --fuente snapshot
